name: text_to_speech
description: "A Flutter app for text-to-speech with natural human voice support."
publish_to: "none"

version: 1.0.1+7

environment:
  sdk: ">=3.8.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  flutter_tts: ^4.2.3
  provider: ^6.1.1
  just_audio: ^0.10.5
  path_provider: ^2.1.2
  sqflite: ^2.3.2
  path: ^1.8.3
  uuid: ^4.2.1
  file_picker: ^10.3.3
  flutter_lame: ^1.0.3
  wav: ^1.5.0
  image_picker: ^1.0.7
  syncfusion_flutter_pdf: ^31.2.4
  permission_handler: ^12.0.1
  google_mlkit_text_recognition: ^0.15.0
  google_mobile_ads: ^9.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
